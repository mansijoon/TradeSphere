[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketforge-quant"
version = "0.1.0"
description = "Quantitative analytics and backtesting engine for MarketForge"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
