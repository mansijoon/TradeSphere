apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: marketforge-messaging
spec:
  ports:
    - name: kafka
      port: 9093
      targetPort: 9093
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: redpanda
  namespace: marketforge-messaging
  labels:
    kubernetes.io/service-name: redpanda
addressType: IPv4
ports:
  - name: kafka
    protocol: TCP
    port: 9093
endpoints:
  - addresses:
      - 10.244.112.28
