apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: marketforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: localhost/marketforge/api-gateway:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: TRADING_SERVICE_URL
              value: "http://trading-service.marketforge.svc.cluster.local:8080"
            - name: MARKET_SERVICE_URL
              value: "http://market-service.marketforge.svc.cluster.local:8082"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: marketforge
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
  type: NodePort
