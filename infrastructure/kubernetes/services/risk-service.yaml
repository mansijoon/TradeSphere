apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
  namespace: marketforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-service
  template:
    metadata:
      labels:
        app: risk-service
    spec:
      containers:
        - name: risk-service
          image: localhost/marketforge/risk-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.marketforge-data.svc.cluster.local:5432/marketforge"
            - name: SPRING_DATASOURCE_USERNAME
              value: "marketforge"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "marketforge_dev"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: risk-service
  namespace: marketforge
spec:
  selector:
    app: risk-service
  ports:
    - port: 8081
      targetPort: 8081
