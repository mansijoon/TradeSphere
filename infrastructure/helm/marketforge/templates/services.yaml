---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: marketforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: {{ .Values.images.apiGateway }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: TRADING_SERVICE_URL
              value: {{ .Values.trading.url | quote }}
            - name: MARKET_SERVICE_URL
              value: {{ .Values.market.url | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: marketforge
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-service
  labels:
    app: market-service
  namespace: marketforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-service
  template:
    metadata:
      labels:
        app: market-service
    spec:
      containers:
        - name: market-service
          image: {{ .Values.images.marketService }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.marketforge-data.svc.cluster.local:5432/marketforge"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.postgres.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.marketServiceBootstrapServers | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: market-service
  labels:
    app: market-service
  namespace: marketforge
spec:
  selector:
    app: market-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
  labels:
    app: risk-service
  namespace: marketforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-service
  template:
    metadata:
      labels:
        app: risk-service
    spec:
      containers:
        - name: risk-service
          image: {{ .Values.images.riskService }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.marketforge-data.svc.cluster.local:5432/marketforge"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.postgres.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.postgres.password | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: risk-service
  labels:
    app: risk-service
  namespace: marketforge
spec:
  selector:
    app: risk-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-service
  labels:
    app: trading-service
  namespace: marketforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-service
  template:
    metadata:
      labels:
        app: trading-service
    spec:
      containers:
        - name: trading-service
          image: {{ .Values.images.tradingService }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: redpanda-truststore
              mountPath: /tmp/redpanda-truststore.p12
              subPath: redpanda-truststore.p12
              readOnly: true
          env:
            - name: REDIS_HOST
              value: "redis.marketforge.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.marketforge-data.svc.cluster.local:5432/marketforge"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.postgres.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: RISK_SERVICE_URL
              value: {{ .Values.risk.url | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
              value: {{ .Values.kafka.securityProtocol | quote }}
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION
              value: {{ .Values.kafka.truststoreLocation | quote }}
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD
              value: {{ .Values.kafka.truststorePassword | quote }}
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_TYPE
              value: {{ .Values.kafka.truststoreType | quote }}
            - name: SPRING_KAFKA_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM
              value: ""
      volumes:
        - name: redpanda-truststore
          secret:
            secretName: redpanda-truststore
---
apiVersion: v1
kind: Service
metadata:
  name: trading-service
  labels:
    app: trading-service
  namespace: marketforge
spec:
  selector:
    app: trading-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine
  namespace: marketforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matching-engine
  template:
    metadata:
      labels:
        app: matching-engine
    spec:
      containers:
        - name: matching-engine
          image: {{ .Values.images.matchingEngine }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          volumeMounts:
            - name: redpanda-ca
              mountPath: /tmp/redpanda-ca.crt
              subPath: redpanda-ca.crt
              readOnly: true
          env:
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.matchingEngineBrokers | quote }}
            - name: KAFKA_TOPIC
              value: "order.commands"
      volumes:
        - name: redpanda-ca
          configMap:
            name: redpanda-ca

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: marketforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: {{ .Values.images.web }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: marketforge
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31080
